org: santiagomorales
# Microservicio 8 - Field Operations / Red TeleCorp
# Desplegar desde esta carpeta: serverless deploy --stage dev
service: redtelecorp-field-operations
frameworkVersion: '4'

provider:
  name: aws
  region: us-east-1
  stage: dev
  runtime: python3.13
  architecture: x86_64
  memorySize: 256
  timeout: 20
  logRetentionInDays: 7
  httpApi:
    name: ${self:service}-${sls:stage}-api
    cors: true   # MVP: integrar autenticacion/Cognito antes de usar datos reales
  environment:
    TECHNICIANS_TABLE: !Ref TechniciansTable
    WORK_ORDERS_TABLE: !Ref WorkOrdersTable
    EVENT_BUS: default
    SHARED_EVENT_BUS: ${param:eventBusName, 'rtc-events-${sls:stage}'}
  iam:
    role: arn:aws:iam::573505212581:role/LabRole

functions:
  fieldOperations:
    name: ${self:service}-${sls:stage}
    handler: field_operations.lambda_handler
    events:
      - httpApi: { method: POST,  path: /technicians }
      - httpApi: { method: GET,   path: /technicians }
      - httpApi: { method: GET,   path: '/technicians/{id}' }
      - httpApi: { method: PATCH, path: '/technicians/{id}' }
      - httpApi: { method: POST,  path: /work-orders }
      - httpApi: { method: GET,   path: /work-orders }
      - httpApi: { method: GET,   path: '/work-orders/{id}' }
      - httpApi: { method: POST,  path: '/work-orders/{id}/assign' }
      - httpApi: { method: PATCH, path: '/work-orders/{id}/status' }
      # Contrato para el microservicio 5; origen: bus EventBridge default.
      - eventBridge:
          pattern:
            source:
              - redtelecorp.incident-management
            detail-type:
              - IncidentNeedsTechnician

  forwardEvents:
    handler: forward_event.lambda_handler
    events:
      - eventBridge:
          eventBus: default
          pattern:
            source:
              - redtelecorp.field-operations
            detail-type:
              - WorkOrderAssigned
              - WorkOrderPending
              - WorkOrderStatusChanged


resources:
  Resources:
    TechniciansTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${sls:stage}-technicians
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: technicianId
            AttributeType: S
          - AttributeName: zoneId
            AttributeType: S
        KeySchema:
          - AttributeName: technicianId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: zoneId-index
            KeySchema:
              - AttributeName: zoneId
                KeyType: HASH
            Projection:
              ProjectionType: ALL
    WorkOrdersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${sls:stage}-work-orders
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: workOrderId
            AttributeType: S
        KeySchema:
          - AttributeName: workOrderId
            KeyType: HASH

    ForwardFailureQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: rtc-field-operations-forward-failures-${sls:stage}
        SqsManagedSseEnabled: true
        MessageRetentionPeriod: 1209600

    ForwardEventRetries:
      Type: AWS::Lambda::EventInvokeConfig
      Properties:
        FunctionName: !Ref ForwardEventsLambdaFunction
        Qualifier: $LATEST
        MaximumRetryAttempts: 2
        MaximumEventAgeInSeconds: 21600
        DestinationConfig:
          OnFailure:
            Destination: !GetAtt ForwardFailureQueue.Arn

    SharedIncidentRule:
      Type: AWS::Events::Rule
      Properties:
        Name: rtc-field-operations-shared-incident-${sls:stage}
        EventBusName: ${param:eventBusName, 'rtc-events-${sls:stage}'}
        EventPattern:
          source:
            - redtelecorp.incident-management
          detail-type:
            - IncidentNeedsTechnician
        Targets:
          - Id: FieldOperations
            Arn: !GetAtt FieldOperationsLambdaFunction.Arn
            RetryPolicy:
              MaximumRetryAttempts: 10
              MaximumEventAgeInSeconds: 86400
            DeadLetterConfig:
              Arn: !GetAtt ForwardFailureQueue.Arn

    SharedIncidentPermission:
      Type: AWS::Lambda::Permission
      Properties:
        FunctionName: !Ref FieldOperationsLambdaFunction
        Action: lambda:InvokeFunction
        Principal: events.amazonaws.com
        SourceArn: !GetAtt SharedIncidentRule.Arn

    SharedIncidentFailurePolicy:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues:
          - !Ref ForwardFailureQueue
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: events.amazonaws.com
              Action: sqs:SendMessage
              Resource: !GetAtt ForwardFailureQueue.Arn
              Condition:
                ArnEquals:
                  aws:SourceArn: !GetAtt SharedIncidentRule.Arn

    WorkOrderRetries:
      Type: AWS::Lambda::EventInvokeConfig
      Properties:
        FunctionName: !Ref FieldOperationsLambdaFunction
        Qualifier: $LATEST
        MaximumRetryAttempts: 2
        MaximumEventAgeInSeconds: 21600
        DestinationConfig:
          OnFailure:
            Destination: !GetAtt ForwardFailureQueue.Arn
