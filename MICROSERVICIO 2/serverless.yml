# Microservicio 2 - Network Infrastructure / Red TeleCorp
# Desplegar desde esta carpeta: serverless deploy --stage dev
# Usa recursos propios por entorno; no importa los creados a mano en Learner Lab.
service: redtelecorp-network-infrastructure
frameworkVersion: '4'

provider:
  name: aws
  region: us-east-1
  stage: dev
  runtime: python3.13
  architecture: x86_64
  memorySize: 256
  timeout: 10
  logRetentionInDays: 7
  httpApi:
    name: ${self:service}-${sls:stage}-api
    cors: true
    authorizers:
      TeleCorpCognito:
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl: https://cognito-idp.${aws:region}.amazonaws.com/${ssm:/telecorp/${sls:stage}/cognito/user-pool-id}
        audience:
          - ${ssm:/telecorp/${sls:stage}/cognito/client-id}
  environment:
    STATIONS_TABLE: !Ref StationsTable
    ANTENNAS_TABLE: !Ref AntennasTable
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:UpdateItem
            - dynamodb:Scan
          Resource:
            - !GetAtt StationsTable.Arn
            - !GetAtt AntennasTable.Arn

functions:
  networkInfrastructure:
    name: ${self:service}-${sls:stage}
    handler: network_infrastructure.lambda_handler
    events:
      - httpApi: { method: POST, path: /stations, authorizer: { name: TeleCorpCognito } }
      - httpApi: { method: GET, path: /stations, authorizer: { name: TeleCorpCognito } }
      - httpApi: { method: GET, path: '/stations/{id}', authorizer: { name: TeleCorpCognito } }
      - httpApi: { method: PATCH, path: '/stations/{id}', authorizer: { name: TeleCorpCognito } }
      - httpApi: { method: POST, path: /antennas, authorizer: { name: TeleCorpCognito } }
      - httpApi: { method: GET, path: /antennas, authorizer: { name: TeleCorpCognito } }
      - httpApi: { method: GET, path: '/antennas/{id}', authorizer: { name: TeleCorpCognito } }
      - httpApi: { method: PATCH, path: '/antennas/{id}', authorizer: { name: TeleCorpCognito } }
      - httpApi: { method: GET, path: '/stations/{id}/antennas', authorizer: { name: TeleCorpCognito } }

resources:
  Resources:
    StationsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${sls:stage}-stations
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: stationId
            AttributeType: S
        KeySchema:
          - AttributeName: stationId
            KeyType: HASH

    AntennasTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${sls:stage}-antennas
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: antennaId
            AttributeType: S
        KeySchema:
          - AttributeName: antennaId
            KeyType: HASH
