org: santiagomorales
# Microservicio 2 - Network Infrastructure / Red TeleCorp
# Desplegar desde esta carpeta: serverless deploy --stage dev
# Usa recursos propios por entorno; no importa los creados a mano en Learner Lab.
service: redtelecorp-network-infrastructure
frameworkVersion: '4'

provider:
  name: aws
  region: us-east-1
  stage: dev
  runtime: python3.13
  architecture: x86_64
  memorySize: 256
  timeout: 10
  logRetentionInDays: 7
  httpApi:
    name: ${self:service}-${sls:stage}-api
    cors: true
  environment:
    STATIONS_TABLE: !Ref StationsTable
    ANTENNAS_TABLE: !Ref AntennasTable
    EVENT_BUS_NAME: ${param:eventBusName, 'rtc-events-${sls:stage}'}
  iam:
    role: arn:aws:iam::573505212581:role/LabRole

functions:
  networkInfrastructure:
    name: ${self:service}-${sls:stage}
    handler: network_infrastructure.lambda_handler
    events:
      - httpApi: { method: POST,  path: /stations }
      - httpApi: { method: GET,   path: /stations }
      - httpApi: { method: GET,   path: '/stations/{id}' }
      - httpApi: { method: PATCH, path: '/stations/{id}' }
      - httpApi: { method: POST,  path: /antennas }
      - httpApi: { method: GET,   path: /antennas }
      - httpApi: { method: GET,   path: '/antennas/{id}' }
      - httpApi: { method: PATCH, path: '/antennas/{id}' }
      - httpApi: { method: GET,   path: '/stations/{id}/antennas' }
      # API interna: los consumidores firman con SigV4.
      - httpApi:
          method: GET
          path: /v1/infrastructure/antennas/{antenna_id}
          authorizer:
            type: aws_iam

  # Publica cambios de antenas/estaciones desde DynamoDB Streams.
  publishAntennaLocation:
    handler: publish_antenna_location.lambda_handler
    timeout: 60

resources:
  Resources:
    StationsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${sls:stage}-stations
        BillingMode: PAY_PER_REQUEST
        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES
        AttributeDefinitions:
          - AttributeName: stationId
            AttributeType: S
        KeySchema:
          - AttributeName: stationId
            KeyType: HASH

    AntennasTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: redtelecorp-antennas
        BillingMode: PAY_PER_REQUEST
        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES
        AttributeDefinitions:
          - AttributeName: antenna_id
            AttributeType: S
          - AttributeName: stationId
            AttributeType: S
        KeySchema:
          - AttributeName: antenna_id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: stationId-index
            KeySchema:
              - AttributeName: stationId
                KeyType: HASH
            Projection:
              ProjectionType: KEYS_ONLY

    LocationFailureQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: rtc-infrastructure-location-failures-${sls:stage}
        SqsManagedSseEnabled: true
        MessageRetentionPeriod: 1209600

    AntennaLocationStream:
      Type: AWS::Lambda::EventSourceMapping
      Properties:
        FunctionName: !Ref PublishAntennaLocationLambdaFunction
        EventSourceArn: !GetAtt AntennasTable.StreamArn
        StartingPosition: TRIM_HORIZON
        BatchSize: 10
        BisectBatchOnFunctionError: true
        MaximumRetryAttempts: 10
        MaximumRecordAgeInSeconds: 82800
        DestinationConfig:
          OnFailure:
            Destination: !GetAtt LocationFailureQueue.Arn

    StationLocationStream:
      Type: AWS::Lambda::EventSourceMapping
      Properties:
        FunctionName: !Ref PublishAntennaLocationLambdaFunction
        EventSourceArn: !GetAtt StationsTable.StreamArn
        StartingPosition: TRIM_HORIZON
        BatchSize: 10
        BisectBatchOnFunctionError: true
        MaximumRetryAttempts: 10
        MaximumRecordAgeInSeconds: 82800
        DestinationConfig:
          OnFailure:
            Destination: !GetAtt LocationFailureQueue.Arn
