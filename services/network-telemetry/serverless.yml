org: santiagomorales
service: rtc-network-telemetry
frameworkVersion: '>=3.40.0 <5.0.0'
provider:
  name: aws
  runtime: python3.12
  architecture: x86_64
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  memorySize: 1024
  timeout: 30
  logRetentionInDays: 14
  iam:
    role: ${param:lambdaRoleArn, 'arn:aws:iam::369907334103:role/LabRole'}
  environment:
    FRONTEND_ORIGIN:
      Ref: FrontendOrigin
package:
  patterns:
  - '!**'
  - handlers/*.py
custom:
  frontendOrigin: ${param:frontendOrigin, env:FRONTEND_ORIGIN}
  identityAuthorizerArn: ${param:identityAuthorizerArn, env:IDENTITY_AUTHORIZER_ARN}
  eventBusName: ${param:eventBusName, 'rtc-events-${sls:stage}'}
  pythonRequirements:
    enabled: false
  requiredIamPolicy:
    Version: '2012-10-17'
    Statement:
    - Effect: Allow
      Action:
      - sqs:SendMessage
      Resource:
        Fn::GetAtt:
        - IngestQueue
        - Arn
    - Effect: Allow
      Action:
      - execute-api:Invoke
      Resource:
        Ref: IntegrationApiArn
    - Effect: Allow
      Action:
      - dynamodb:GetItem
      Resource:
        Fn::GetAtt:
        - LatestTable
        - Arn
    - Effect: Allow
      Action:
      - dynamodb:Query
      Resource:
        Fn::GetAtt:
        - HistoryTable
        - Arn
    - Effect: Allow
      Action:
      - dynamodb:Query
      Resource:
        Fn::Sub: ${AlertsTable.Arn}/index/*
    - Effect: Allow
      Action:
      - dynamodb:GetItem
      Resource:
      - Fn::GetAtt:
        - LatestTable
        - Arn
      - Fn::GetAtt:
        - HistoryTable
        - Arn
    - Effect: Allow
      Action:
      - dynamodb:PutItem
      Resource:
      - Fn::GetAtt:
        - LatestTable
        - Arn
      - Fn::GetAtt:
        - HistoryTable
        - Arn
      - Fn::GetAtt:
        - AlertsTable
        - Arn
    - Effect: Allow
      Action:
      - sqs:ReceiveMessage
      - sqs:DeleteMessage
      - sqs:GetQueueAttributes
      Resource:
        Fn::GetAtt:
        - IngestQueue
        - Arn
    - Effect: Allow
      Action:
      - s3:PutObject
      Resource:
        Fn::Sub: ${HistoryBucket.Arn}/telemetry/*
    - Effect: Allow
      Action:
      - dynamodb:DescribeStream
      - dynamodb:GetRecords
      - dynamodb:GetShardIterator
      - dynamodb:ListStreams
      Resource:
        Fn::GetAtt:
        - HistoryTable
        - StreamArn
    - Effect: Allow
      Action:
      - sqs:SendMessage
      Resource:
        Fn::GetAtt:
        - StreamFailureQueue
        - Arn
    - Effect: Allow
      Action:
      - events:PutEvents
      Resource:
        Fn::Sub: arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/${EventBusName}
      Condition:
        StringEquals:
          events:source: network-telemetry
    - Effect: Allow
      Action:
      - dynamodb:DescribeStream
      - dynamodb:GetRecords
      - dynamodb:GetShardIterator
      - dynamodb:ListStreams
      Resource:
        Fn::GetAtt:
        - AlertsTable
        - StreamArn
functions:
  postTelemetry:
    name: rtc-network-telemetry-post-telemetry-${sls:stage}
    handler: handlers.post_telemetry.lambda_handler
    memorySize: 256
    timeout: 30
    environment:
      INGEST_QUEUE_URL:
        Ref: IngestQueue
      INFRASTRUCTURE_API_URL:
        Ref: InfrastructureApiUrl
      MAX_BATCH:
        Ref: MaxBatch
    events:
    - http:
        path: v1/telemetry
        method: post
        integration: lambda-proxy
        cors:
          origin: ${self:custom.frontendOrigin}
          headers:
          - Content-Type
          - Authorization
          - Idempotency-Key
          allowCredentials: false
        authorizer:
          name: identityAuthorizer
          arn: ${self:custom.identityAuthorizerArn}
          type: request
          identitySource: method.request.header.Authorization
          resultTtlInSeconds: 0
          managedExternally: true
  postTelemetryBatch:
    name: rtc-network-telemetry-post-telemetry-batch-${sls:stage}
    handler: handlers.post_telemetry_batch.lambda_handler
    memorySize: 256
    timeout: 30
    environment:
      INGEST_QUEUE_URL:
        Ref: IngestQueue
      INFRASTRUCTURE_API_URL:
        Ref: InfrastructureApiUrl
      MAX_BATCH:
        Ref: MaxBatch
    events:
    - http:
        path: v1/telemetry/batch
        method: post
        integration: lambda-proxy
        cors:
          origin: ${self:custom.frontendOrigin}
          headers:
          - Content-Type
          - Authorization
          - Idempotency-Key
          allowCredentials: false
        authorizer:
          name: identityAuthorizer
          arn: ${self:custom.identityAuthorizerArn}
          type: request
          identitySource: method.request.header.Authorization
          resultTtlInSeconds: 0
          managedExternally: true
  getAntennaLatest:
    name: rtc-network-telemetry-get-antenna-latest-${sls:stage}
    handler: handlers.get_antenna_latest.lambda_handler
    memorySize: 256
    timeout: 30
    environment:
      LATEST_TABLE:
        Ref: LatestTable
    events:
    - http:
        path: v1/telemetry/antennas/{antennaId}/latest
        method: get
        integration: lambda-proxy
        cors:
          origin: ${self:custom.frontendOrigin}
          headers:
          - Content-Type
          - Authorization
          - Idempotency-Key
          allowCredentials: false
        authorizer:
          name: identityAuthorizer
          arn: ${self:custom.identityAuthorizerArn}
          type: request
          identitySource: method.request.header.Authorization
          resultTtlInSeconds: 0
          managedExternally: true
  getAntennaHistory:
    name: rtc-network-telemetry-get-antenna-history-${sls:stage}
    handler: handlers.get_antenna_history.lambda_handler
    memorySize: 256
    timeout: 30
    environment:
      HISTORY_TABLE:
        Ref: HistoryTable
    events:
    - http:
        path: v1/telemetry/antennas/{antennaId}/history
        method: get
        integration: lambda-proxy
        cors:
          origin: ${self:custom.frontendOrigin}
          headers:
          - Content-Type
          - Authorization
          - Idempotency-Key
          allowCredentials: false
        authorizer:
          name: identityAuthorizer
          arn: ${self:custom.identityAuthorizerArn}
          type: request
          identitySource: method.request.header.Authorization
          resultTtlInSeconds: 0
          managedExternally: true
  getAntennaSummary:
    name: rtc-network-telemetry-get-antenna-summary-${sls:stage}
    handler: handlers.get_antenna_summary.lambda_handler
    memorySize: 256
    timeout: 30
    environment:
      HISTORY_TABLE:
        Ref: HistoryTable
    events:
    - http:
        path: v1/telemetry/antennas/{antennaId}/summary
        method: get
        integration: lambda-proxy
        cors:
          origin: ${self:custom.frontendOrigin}
          headers:
          - Content-Type
          - Authorization
          - Idempotency-Key
          allowCredentials: false
        authorizer:
          name: identityAuthorizer
          arn: ${self:custom.identityAuthorizerArn}
          type: request
          identitySource: method.request.header.Authorization
          resultTtlInSeconds: 0
          managedExternally: true
  getTelemetryAlerts:
    name: rtc-network-telemetry-get-telemetry-alerts-${sls:stage}
    handler: handlers.get_telemetry_alerts.lambda_handler
    memorySize: 256
    timeout: 30
    environment:
      ALERTS_TABLE:
        Ref: AlertsTable
    events:
    - http:
        path: v1/telemetry/alerts
        method: get
        integration: lambda-proxy
        cors:
          origin: ${self:custom.frontendOrigin}
          headers:
          - Content-Type
          - Authorization
          - Idempotency-Key
          allowCredentials: false
        authorizer:
          name: identityAuthorizer
          arn: ${self:custom.identityAuthorizerArn}
          type: request
          identitySource: method.request.header.Authorization
          resultTtlInSeconds: 0
          managedExternally: true
  processTelemetry:
    name: rtc-network-telemetry-process-telemetry-${sls:stage}
    handler: handlers.process_telemetry.lambda_handler
    memorySize: 256
    timeout: 30
    environment:
      LATEST_TABLE:
        Ref: LatestTable
      HISTORY_TABLE:
        Ref: HistoryTable
      ALERTS_TABLE:
        Ref: AlertsTable
    events:
    - sqs:
        arn:
          Fn::GetAtt:
          - IngestQueue
          - Arn
        batchSize: 10
        maximumBatchingWindow: 2
        functionResponseType: ReportBatchItemFailures
  archiveTelemetry:
    name: rtc-network-telemetry-archive-telemetry-${sls:stage}
    handler: handlers.archive_telemetry.lambda_handler
    memorySize: 256
    timeout: 30
    environment:
      HISTORY_BUCKET:
        Ref: HistoryBucket
  publishTelemetryAlert:
    name: rtc-network-telemetry-publish-telemetry-alert-${sls:stage}
    handler: handlers.publish_telemetry_alert.lambda_handler
    memorySize: 256
    timeout: 30
    environment:
      EVENT_BUS_NAME:
        Ref: EventBusName
resources:
  Parameters:
    FrontendOrigin:
      Type: String
      AllowedPattern: https://[^/]+
      Description: Origen HTTPS exacto del frontend
      Default: ${self:custom.frontendOrigin}
    EventBusName:
      Type: String
      Default: ${self:custom.eventBusName}
      Description: Bus compartido existente o creado con shared-template.yaml
    IntegrationApiArn:
      Type: String
      Default: ${param:integrationApiArn, 'arn:aws:execute-api:us-east-1:000000000000:unconfigured/*'}
      Description: ARN exacto del API externo autorizado; placeholder deliberadamente
        no operativo
    InfrastructureApiUrl:
      Type: String
      Default: ${param:infrastructureApiUrl, ''}
    MaxBatch:
      Type: Number
      Default: ${param:maxBatch, 100}
      MinValue: 1
      MaxValue: 500
    CreateEventBus:
      Type: String
      Default: ${param:createEventBus, 'false'}
      AllowedValues:
      - 'true'
      - 'false'
  Resources:
    StreamFailureQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName:
          Fn::Sub: rtc-network-telemetry-stream-failures-${sls:stage}
        SqsManagedSseEnabled: true
        MessageRetentionPeriod: 1209600
        VisibilityTimeout: 360
    LatestTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName:
          Fn::Sub: rtc-telemetry-latest-${sls:stage}
        BillingMode: PAY_PER_REQUEST
        KeySchema:
        - AttributeName: antenna_id
          KeyType: HASH
        AttributeDefinitions:
        - AttributeName: antenna_id
          AttributeType: S
        SSESpecification:
          SSEEnabled: true
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
    HistoryTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName:
          Fn::Sub: rtc-telemetry-history-index-${sls:stage}
        BillingMode: PAY_PER_REQUEST
        KeySchema:
        - AttributeName: antenna_id
          KeyType: HASH
        - AttributeName: measurement_key
          KeyType: RANGE
        AttributeDefinitions:
        - AttributeName: antenna_id
          AttributeType: S
        - AttributeName: measurement_key
          AttributeType: S
        SSESpecification:
          SSEEnabled: true
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES
    AlertsTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName:
          Fn::Sub: rtc-telemetry-alerts-${sls:stage}
        BillingMode: PAY_PER_REQUEST
        KeySchema:
        - AttributeName: antenna_id
          KeyType: HASH
        - AttributeName: alert_timestamp_id
          KeyType: RANGE
        AttributeDefinitions:
        - AttributeName: alert_timestamp_id
          AttributeType: S
        - AttributeName: antenna_id
          AttributeType: S
        - AttributeName: feed
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        SSESpecification:
          SSEEnabled: true
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        GlobalSecondaryIndexes:
        - IndexName: status-date
          KeySchema:
          - AttributeName: status
            KeyType: HASH
          - AttributeName: alert_timestamp_id
            KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: feed-date
          KeySchema:
          - AttributeName: feed
            KeyType: HASH
          - AttributeName: alert_timestamp_id
            KeyType: RANGE
          Projection:
            ProjectionType: ALL
        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES
    IngestDlq:
      Type: AWS::SQS::Queue
      Properties:
        QueueName:
          Fn::Sub: rtc-telemetry-ingest-dlq-${sls:stage}
        SqsManagedSseEnabled: true
        MessageRetentionPeriod: 1209600
        VisibilityTimeout: 360
    IngestQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName:
          Fn::Sub: rtc-telemetry-ingest-${sls:stage}
        SqsManagedSseEnabled: true
        MessageRetentionPeriod: 1209600
        VisibilityTimeout: 360
        RedrivePolicy:
          deadLetterTargetArn:
            Fn::GetAtt:
            - IngestDlq
            - Arn
          maxReceiveCount: 5
    HistoryBucket:
      Type: AWS::S3::Bucket
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        BucketName:
          Fn::Sub: rtc-telemetry-history-${AWS::AccountId}-${AWS::Region}-${sls:stage}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          IgnorePublicAcls: true
          BlockPublicPolicy: true
          RestrictPublicBuckets: true
        BucketEncryption:
          ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
        VersioningConfiguration:
          Status: Enabled
        OwnershipControls:
          Rules:
          - ObjectOwnership: BucketOwnerEnforced
    HistoryBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket:
          Ref: HistoryBucket
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
            - Fn::GetAtt:
              - HistoryBucket
              - Arn
            - Fn::Sub: ${HistoryBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'
    PostTelemetryErrors:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmDescription: Errores Lambda; conectar acciones operativas al desplegar
        Namespace: AWS/Lambda
        MetricName: Errors
        Dimensions:
        - Name: FunctionName
          Value:
            Ref: PostTelemetryLambdaFunction
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
    PostTelemetryBatchErrors:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmDescription: Errores Lambda; conectar acciones operativas al desplegar
        Namespace: AWS/Lambda
        MetricName: Errors
        Dimensions:
        - Name: FunctionName
          Value:
            Ref: PostTelemetryBatchLambdaFunction
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
    GetAntennaLatestErrors:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmDescription: Errores Lambda; conectar acciones operativas al desplegar
        Namespace: AWS/Lambda
        MetricName: Errors
        Dimensions:
        - Name: FunctionName
          Value:
            Ref: GetAntennaLatestLambdaFunction
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
    GetAntennaHistoryErrors:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmDescription: Errores Lambda; conectar acciones operativas al desplegar
        Namespace: AWS/Lambda
        MetricName: Errors
        Dimensions:
        - Name: FunctionName
          Value:
            Ref: GetAntennaHistoryLambdaFunction
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
    GetAntennaSummaryErrors:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmDescription: Errores Lambda; conectar acciones operativas al desplegar
        Namespace: AWS/Lambda
        MetricName: Errors
        Dimensions:
        - Name: FunctionName
          Value:
            Ref: GetAntennaSummaryLambdaFunction
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
    GetTelemetryAlertsErrors:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmDescription: Errores Lambda; conectar acciones operativas al desplegar
        Namespace: AWS/Lambda
        MetricName: Errors
        Dimensions:
        - Name: FunctionName
          Value:
            Ref: GetTelemetryAlertsLambdaFunction
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
    ProcessTelemetryErrors:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmDescription: Errores Lambda; conectar acciones operativas al desplegar
        Namespace: AWS/Lambda
        MetricName: Errors
        Dimensions:
        - Name: FunctionName
          Value:
            Ref: ProcessTelemetryLambdaFunction
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
    ArchiveTelemetryErrors:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmDescription: Errores Lambda; conectar acciones operativas al desplegar
        Namespace: AWS/Lambda
        MetricName: Errors
        Dimensions:
        - Name: FunctionName
          Value:
            Ref: ArchiveTelemetryLambdaFunction
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
    PublishTelemetryAlertErrors:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmDescription: Errores Lambda; conectar acciones operativas al desplegar
        Namespace: AWS/Lambda
        MetricName: Errors
        Dimensions:
        - Name: FunctionName
          Value:
            Ref: PublishTelemetryAlertLambdaFunction
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
    StreamFailureQueueAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        Namespace: AWS/SQS
        MetricName: ApproximateNumberOfMessagesVisible
        Statistic: Maximum
        Dimensions:
        - Name: QueueName
          Value:
            Fn::GetAtt:
            - StreamFailureQueue
            - QueueName
        Period: 300
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
    IngestDlqAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        Namespace: AWS/SQS
        MetricName: ApproximateNumberOfMessagesVisible
        Statistic: Maximum
        Dimensions:
        - Name: QueueName
          Value:
            Fn::GetAtt:
            - IngestDlq
            - QueueName
        Period: 300
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
    ArchiveTelemetryHistoryTableMapping:
      Type: AWS::Lambda::EventSourceMapping
      Properties:
        FunctionName:
          Ref: ArchiveTelemetryLambdaFunction
        EventSourceArn:
          Fn::GetAtt:
          - HistoryTable
          - StreamArn
        StartingPosition: TRIM_HORIZON
        BatchSize: 100
        MaximumBatchingWindowInSeconds: 5
        BisectBatchOnFunctionError: true
        MaximumRetryAttempts: 10
        MaximumRecordAgeInSeconds: 82800
        DestinationConfig:
          OnFailure:
            Destination:
              Fn::GetAtt:
              - StreamFailureQueue
              - Arn
    PublishTelemetryAlertAlertsTableMapping:
      Type: AWS::Lambda::EventSourceMapping
      Properties:
        FunctionName:
          Ref: PublishTelemetryAlertLambdaFunction
        EventSourceArn:
          Fn::GetAtt:
          - AlertsTable
          - StreamArn
        StartingPosition: TRIM_HORIZON
        BatchSize: 100
        MaximumBatchingWindowInSeconds: 5
        BisectBatchOnFunctionError: true
        MaximumRetryAttempts: 10
        MaximumRecordAgeInSeconds: 82800
        DestinationConfig:
          OnFailure:
            Destination:
              Fn::GetAtt:
              - StreamFailureQueue
              - Arn
    EventBus:
      Type: AWS::Events::EventBus
      Condition: CreateSharedBus
      Properties:
        Name:
          Ref: EventBusName
  Outputs:
    EventBusName:
      Value:
        Ref: EventBusName
  Conditions:
    CreateSharedBus:
      Fn::Equals:
      - Ref: CreateEventBus
      - 'true'
