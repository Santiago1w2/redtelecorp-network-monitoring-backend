org: santiagomorales
service: rtc-notifications
# 1. AWS, rol del laboratorio y variables compartidas por las Lambdas.
provider:
  name: aws
  runtime: python3.12
  architecture: x86_64
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  memorySize: 256
  timeout: 30
  logRetentionInDays: 14
  iam:
    role: arn:aws:iam::573505212581:role/LabRole
  environment:
    FRONTEND_ORIGIN: ${param:frontendOrigin, env:FRONTEND_ORIGIN}
    NOTIFICATIONS_TABLE: rtc-notifications-${sls:stage}
    PREFERENCES_TABLE: rtc-notification-preferences-${sls:stage}
    IDEMPOTENCY_TABLE: rtc-notification-idempotency-${sls:stage}
    IDENTITY_API_URL: ${param:identityApiUrl, ''}
    REPORTS_API_URL: ${param:reportsApiUrl, ''}
    SEND_QUEUE_URL: {Ref: SendQueue}
    DELIVERY_ENABLED: ${param:deliveryEnabled, 'false'}
    SES_FROM_ADDRESS: ${param:sesFromAddress, ''}
    SES_CONFIGURATION_SET: {Ref: SesConfigurationSet}
    DELIVERY_TOPIC_ARN: {Ref: DeliveryTopic}
    EVENT_BUS_NAME: ${param:eventBusName, 'rtc-events-${sls:stage}'}

# 2. CORS y autenticación comunes para no repetirlos en cada endpoint.
custom:
  cors:
    origin: ${self:provider.environment.FRONTEND_ORIGIN}
    headers:
      - Content-Type
      - Authorization
      - Idempotency-Key
  authorizer:
    name: TeleCorpAuthorizer
    type: COGNITO_USER_POOLS
    # Identity publica este ARN en SSM; el parámetro permite usar un ARN explícito.
    arn: ${param:cognitoUserPoolArn, ssm:/telecorp/${sls:stage}/cognito/user-pool-arn}

# 3. Una Lambda por archivo; cada http indica su ruta y método.
# lambda-proxy conserva el statusCode y body que devuelve el handler.
functions:

  # post_notification.py
  postNotification:
    name: rtc-notifications-post-notification-${sls:stage}
    handler: handlers.post_notification.lambda_handler
    events:
      - http:
          path: /v1/notifications
          method: post
          integration: lambda-proxy
          cors: ${self:custom.cors}
          authorizer: ${self:custom.authorizer}

  # get_notifications.py
  getNotifications:
    name: rtc-notifications-get-notifications-${sls:stage}
    handler: handlers.get_notifications.lambda_handler
    events:
      - http:
          path: /v1/notifications
          method: get
          integration: lambda-proxy
          cors: ${self:custom.cors}
          authorizer: ${self:custom.authorizer}

  # get_notification.py
  getNotification:
    name: rtc-notifications-get-notification-${sls:stage}
    handler: handlers.get_notification.lambda_handler
    events:
      - http:
          path: /v1/notifications/{notificationId}
          method: get
          integration: lambda-proxy
          cors: ${self:custom.cors}
          authorizer: ${self:custom.authorizer}

  # patch_notification_read.py
  patchNotificationRead:
    name: rtc-notifications-patch-notification-read-${sls:stage}
    handler: handlers.patch_notification_read.lambda_handler
    events:
      - http:
          path: /v1/notifications/{notificationId}/read
          method: patch
          integration: lambda-proxy
          cors: ${self:custom.cors}
          authorizer: ${self:custom.authorizer}

  # put_notification_preferences.py
  putNotificationPreferences:
    name: rtc-notifications-put-notification-preferences-${sls:stage}
    handler: handlers.put_notification_preferences.lambda_handler
    events:
      - http:
          path: /v1/notifications/preferences
          method: put
          integration: lambda-proxy
          cors: ${self:custom.cors}
          authorizer: ${self:custom.authorizer}

  # consume_incident_events.py
  consumeIncidentEvents:
    name: rtc-notifications-consume-incident-events-${sls:stage}
    handler: handlers.consume_incident_events.lambda_handler
    timeout: 300

  # send_notification.py
  sendNotification:
    name: rtc-notifications-send-notification-${sls:stage}
    handler: handlers.send_notification.lambda_handler
    events:
      - sqs:
          arn: {'Fn::GetAtt': [SendQueue, Arn]}
          batchSize: 10
          maximumBatchingWindow: 2
          functionResponseType: ReportBatchItemFailures
    timeout: 45

  # process_delivery_status.py
  processDeliveryStatus:
    name: rtc-notifications-process-delivery-status-${sls:stage}
    handler: handlers.process_delivery_status.lambda_handler

# 4. Archivos que se suben a Lambda.
package:
  patterns:
    - '!**'
    - handlers/*.py

# 5. Recursos creados por CloudFormation, como en las prácticas.
# Ref obtiene nombre/URL del recurso; Fn::GetAtt obtiene su ARN u otro atributo.
resources:
  Resources:

    # Tabla DynamoDB: NotificationsTable.
    NotificationsTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${self:provider.environment.NOTIFICATIONS_TABLE}
        AttributeDefinitions:
          - AttributeName: notification_id
            AttributeType: S
          - AttributeName: notification_key
            AttributeType: S
          - AttributeName: recipient_id
            AttributeType: S
        KeySchema:
          - AttributeName: recipient_id
            KeyType: HASH
          - AttributeName: notification_key
            KeyType: RANGE
        BillingMode: PAY_PER_REQUEST
        SSESpecification:
          SSEEnabled: true
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        GlobalSecondaryIndexes:
          - IndexName: notification-id
            KeySchema:
              - AttributeName: notification_id
                KeyType: HASH
            Projection:
              ProjectionType: ALL
        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES

    # Tabla DynamoDB: PreferencesTable.
    PreferencesTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${self:provider.environment.PREFERENCES_TABLE}
        AttributeDefinitions:
          - AttributeName: user_id
            AttributeType: S
        KeySchema:
          - AttributeName: user_id
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
        SSESpecification:
          SSEEnabled: true
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

    # Tabla DynamoDB: IdempotencyTable.
    IdempotencyTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${self:provider.environment.IDEMPOTENCY_TABLE}
        AttributeDefinitions:
          - AttributeName: idempotency_key
            AttributeType: S
        KeySchema:
          - AttributeName: idempotency_key
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
        SSESpecification:
          SSEEnabled: true
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        TimeToLiveSpecification:
          AttributeName: expires_at
          Enabled: true

    # Cola SQS: StreamFailureQueue.
    StreamFailureQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: rtc-notifications-stream-failures-${sls:stage}
        SqsManagedSseEnabled: true
        MessageRetentionPeriod: 1209600
        VisibilityTimeout: 360

    # Cola SQS: SendDlq.
    SendDlq:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: rtc-notifications-send-dlq-${sls:stage}
        SqsManagedSseEnabled: true
        MessageRetentionPeriod: 1209600
        VisibilityTimeout: 360

    # Cola SQS: SendQueue.
    SendQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: rtc-notifications-send-${sls:stage}
        SqsManagedSseEnabled: true
        MessageRetentionPeriod: 1209600
        VisibilityTimeout: 360
        RedrivePolicy:
          deadLetterTargetArn: {'Fn::GetAtt': [SendDlq, Arn]}
          maxReceiveCount: 5

    # Topic SNS: DeliveryTopic.
    DeliveryTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: rtc-notifications-delivery-${sls:stage}

    DeliveryTopicPolicy:
      Type: AWS::SNS::TopicPolicy
      Properties:
        Topics:
          - {Ref: DeliveryTopic}
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: ses.amazonaws.com
              Action: sns:Publish
              Resource: {Ref: DeliveryTopic}
              Condition:
                StringEquals:
                  AWS:SourceAccount: {Ref: 'AWS::AccountId'}
                ArnEquals:
                  AWS:SourceArn:
                    Fn::Sub: arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:configuration-set/${SesConfigurationSet}

    SesConfigurationSet:
      Type: AWS::SES::ConfigurationSet
      Properties:
        Name: rtc-notifications-${sls:stage}

    SesEvents:
      Type: AWS::SES::ConfigurationSetEventDestination
      DependsOn: DeliveryTopicPolicy
      Properties:
        ConfigurationSetName: {Ref: SesConfigurationSet}
        EventDestination:
          Name: DeliveryStatus
          Enabled: true
          MatchingEventTypes:
            - delivery
            - bounce
            - complaint
            - reject
          SnsDestination:
            TopicARN: {Ref: DeliveryTopic}

    # Regla de eventos: IncidentRule.
    IncidentRule:
      Type: AWS::Events::Rule
      Properties:
        Name: rtc-notifications-incidentrule-${sls:stage}
        EventBusName: ${param:eventBusName, 'rtc-events-${sls:stage}'}
        EventPattern:
          source:
            - incident-management
          detail-type:
            - incident.collective.detected
            - incident.status.changed
            - incident.resolved
        Targets:
          - Id: ConsumeIncidentEvents
            Arn: {'Fn::GetAtt': [ConsumeIncidentEventsLambdaFunction, Arn]}
            RetryPolicy:
              MaximumRetryAttempts: 10
              MaximumEventAgeInSeconds: 86400
            DeadLetterConfig:
              Arn: {'Fn::GetAtt': [StreamFailureQueue, Arn]}

    IncidentRulePermission:
      Type: AWS::Lambda::Permission
      Properties:
        Action: lambda:InvokeFunction
        FunctionName: {Ref: ConsumeIncidentEventsLambdaFunction}
        Principal: events.amazonaws.com
        SourceArn: {'Fn::GetAtt': [IncidentRule, Arn]}

    EventFailureQueuePolicy:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues:
          - {Ref: StreamFailureQueue}
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: events.amazonaws.com
              Action: sqs:SendMessage
              Resource: {'Fn::GetAtt': [StreamFailureQueue, Arn]}
              Condition:
                ArnEquals:
                  aws:SourceArn: {'Fn::GetAtt': [IncidentRule, Arn]}
            - Effect: Allow
              Principal:
                Service: events.amazonaws.com
              Action: sqs:SendMessage
              Resource: {'Fn::GetAtt': [StreamFailureQueue, Arn]}
              Condition:
                ArnEquals:
                  aws:SourceArn: {'Fn::GetAtt': [ProviderRule, Arn]}

    # Regla de eventos: ProviderRule.
    ProviderRule:
      Type: AWS::Events::Rule
      Properties:
        Name: rtc-notifications-providerrule-${sls:stage}
        EventBusName: ${param:eventBusName, 'rtc-events-${sls:stage}'}
        EventPattern:
          source:
            - notification-provider
          detail-type:
            - notification.delivery.updated
        Targets:
          - Id: ProcessDeliveryStatus
            Arn: {'Fn::GetAtt': [ProcessDeliveryStatusLambdaFunction, Arn]}
            RetryPolicy:
              MaximumRetryAttempts: 10
              MaximumEventAgeInSeconds: 86400
            DeadLetterConfig:
              Arn: {'Fn::GetAtt': [StreamFailureQueue, Arn]}

    ProviderRulePermission:
      Type: AWS::Lambda::Permission
      Properties:
        Action: lambda:InvokeFunction
        FunctionName: {Ref: ProcessDeliveryStatusLambdaFunction}
        Principal: events.amazonaws.com
        SourceArn: {'Fn::GetAtt': [ProviderRule, Arn]}

    DeliverySubscription:
      Type: AWS::SNS::Subscription
      Properties:
        TopicArn: {Ref: DeliveryTopic}
        Protocol: lambda
        Endpoint: {'Fn::GetAtt': [ProcessDeliveryStatusLambdaFunction, Arn]}

    DeliveryPermission:
      Type: AWS::Lambda::Permission
      Properties:
        FunctionName: {Ref: ProcessDeliveryStatusLambdaFunction}
        Action: lambda:InvokeFunction
        Principal: sns.amazonaws.com
        SourceArn: {Ref: DeliveryTopic}
        SourceAccount: {Ref: 'AWS::AccountId'}

    ConsumeIncidentEventsAsync:
      Type: AWS::Lambda::EventInvokeConfig
      Properties:
        FunctionName: {Ref: ConsumeIncidentEventsLambdaFunction}
        Qualifier: $LATEST
        MaximumRetryAttempts: 2
        MaximumEventAgeInSeconds: 21600
        DestinationConfig:
          OnFailure:
            Destination: {'Fn::GetAtt': [StreamFailureQueue, Arn]}

    ProcessDeliveryStatusAsync:
      Type: AWS::Lambda::EventInvokeConfig
      Properties:
        FunctionName: {Ref: ProcessDeliveryStatusLambdaFunction}
        Qualifier: $LATEST
        MaximumRetryAttempts: 2
        MaximumEventAgeInSeconds: 21600
        DestinationConfig:
          OnFailure:
            Destination: {'Fn::GetAtt': [StreamFailureQueue, Arn]}

    # Conecta DynamoDB Streams con la Lambda: SendNotificationNotificationsTableMapping.
    SendNotificationNotificationsTableMapping:
      Type: AWS::Lambda::EventSourceMapping
      Properties:
        FunctionName: {Ref: SendNotificationLambdaFunction}
        EventSourceArn: {'Fn::GetAtt': [NotificationsTable, StreamArn]}
        StartingPosition: TRIM_HORIZON
        BatchSize: 100
        MaximumBatchingWindowInSeconds: 5
        BisectBatchOnFunctionError: true
        MaximumRetryAttempts: 10
        MaximumRecordAgeInSeconds: 82800
        DestinationConfig:
          OnFailure:
            Destination: {'Fn::GetAtt': [StreamFailureQueue, Arn]}

    # Alarma de errores o mensajes fallidos: SendNotificationErrors.
    SendNotificationErrors:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmDescription: Errores Lambda; conectar acciones operativas al desplegar
        Namespace: AWS/Lambda
        MetricName: Errors
        Dimensions:
          - Name: FunctionName
            Value: {Ref: SendNotificationLambdaFunction}
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching

    # Alarma de errores o mensajes fallidos: StreamFailureQueueAlarm.
    StreamFailureQueueAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        Namespace: AWS/SQS
        MetricName: ApproximateNumberOfMessagesVisible
        Statistic: Maximum
        Dimensions:
          - Name: QueueName
            Value: {'Fn::GetAtt': [StreamFailureQueue, QueueName]}
        Period: 300
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching

    # Alarma de errores o mensajes fallidos: SendDlqAlarm.
    SendDlqAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        Namespace: AWS/SQS
        MetricName: ApproximateNumberOfMessagesVisible
        Statistic: Maximum
        Dimensions:
          - Name: QueueName
            Value: {'Fn::GetAtt': [SendDlq, QueueName]}
        Period: 300
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching

  Outputs:
    EventBusName:
      Value: ${param:eventBusName, 'rtc-events-${sls:stage}'}
